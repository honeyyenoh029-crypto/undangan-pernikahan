<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan - Bunga & Dimas</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold-primary: #9A7B38;
            --gold-light: #D4AF37;
            --gold-dark: #6e5520;
            --bg-paper: #FCFAF5;
            --text-dark: #2C2A29;
            --text-muted: #5C5855;
            --sage-green: #687968;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1918;
            font-family: 'Cormorant Garamond', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-dark);
        }

        .invitation-card {
            position: relative;
            width: 1000px;
            height: 562px;
            background-color: var(--bg-paper);
            
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.75) 0%, rgba(252, 250, 245, 0.4) 100%),
                url("background.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 100px rgba(154, 123, 56, 0.08);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 35px 50px;
        }

        .card-frame {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid var(--gold-primary);
            outline: 1px solid var(--gold-light);
            outline-offset: -5px;
            pointer-events: none;
            z-index: 3;
        }

        .card-frame-inner {
            position: absolute;
            top: 25px;
            left: 25px;
            right: 25px;
            bottom: 25px;
            border: 1px dashed rgba(154, 123, 56, 0.3);
            pointer-events: none;
            z-index: 3;
        }

        .photo-edge {
            position: absolute;
            width: auto;
            max-width: 320px;
            z-index: 2;
            pointer-events: none;
            object-fit: contain;
            filter: drop-shadow(2px 4px 10px rgba(0,0,0,0.05));
        }

        .photo-edge-left {
            left: 0;
            top: -20%;
            height: 80%;
        }

        .photo-edge-left-down {
            left: 0;
            top:43%;
            height: 60%;
        }

        .photo-edge-right {
            right: 0;
            top: -20%;
            height: 80%;
        }

        .watermark-monogram {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Great Vibes', cursive;
            font-size: 170px;
            color: rgba(154, 123, 56, 0.06);
            user-select: none;
            z-index: 1;
            white-space: nowrap;
        }

        .content {
            position: relative;
            z-index: 4;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        .header-section {
            margin-top: 10px;
        }

        .top-sub-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--gold-dark);
            margin-bottom: 5px;
            font-weight: 700;
        }

        .main-title {
            font-family: 'Alex Brush', cursive;
            font-size: 58px;
            color: var(--gold-primary);
            line-height: 1.1;
            text-shadow: 0.5px 0.5px 0px rgba(0,0,0,0.1);
        }

        .wedding-of {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 20px;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-top: -2px;
        }

        .couple-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: -20px 0;
        }

        .gold-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 320px;
            margin: 6px 0;
        }

        .gold-divider::before,
        .gold-divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--gold-primary), transparent);
        }

        .gold-divider-icon {
            margin: 0 12px;
            color: var(--gold-primary);
            font-size: 12px;
        }

        .couples-name {
            font-family: 'Cinzel', serif;
            font-size: 35px;
            font-weight: 650;
            letter-spacing: 6px;
            color: var(--text-dark);
            text-transform: uppercase;
            line-height: 1.2;
        }

        .ampersand {
            font-family: 'Alex Brush', cursive;
            font-size: 34px;
            color: var(--gold-primary);
            font-weight: normal;
            margin: 2px 0;
            text-transform: none;
        }

        .date-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: px;
        }

        .date-box {
            font-family: 'Cinzel', serif;
            font-size: 25px;
            font-weight: 700;
            color: var(--gold-dark);
            letter-spacing: 3px;
        }

        .date-divider {
            width: 1px;
            height: 35px;
            background-color: var(--gold-primary);
            opacity: 0.5;
        }

        .details-section {
            margin-bottom: 10px;
        }

        .venue-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-dark);
            margin-bottom: 5zpx;
        }

        .venue-address {
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
            color: var(--text-muted);
            font-style: italic;
        }

        .wax-seal {
            position: absolute;
            bottom: 28px;
            right: 35px;
            width: 55px;
            height: 55px;
            background: radial-gradient(circle at 30% 30%, #D4AF37, #8A6B22);
            border-radius: 50%;
            box-shadow: 2px 3px 8px rgba(0,0,0,0.3), inset 0 0 5px rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            border: 2px solid #73571A;
        }

        .wax-seal-inner {
            width: 43px;
            height: 43px;
            border: 1px dashed rgba(255,255,255,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: bold;
            color: #FFF;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }

        @media print {
            body {
                background: none;
                padding: 0;
            }
            .invitation-card {
                box-shadow: none;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <div class="card-frame"></div>
        <div class="card-frame-inner"></div>

        <img src="bunga-pinggir-kiri.png" 
             class="photo-edge photo-edge-left" 
             alt="Hiasan Pinggir Kiri">

        <img src="wayang.jpeg" 
             class="photo-edge photo-edge-left-down" 
             alt="Hiasan Pinggir Kiri">

        <img src="bunga-pinggir-kanan.png" 
             class="photo-edge photo-edge-right" 
             alt="Hiasan Pinggir Kanan">

        <div class="watermark-monogram">B & D</div>

        <div class="content">
            
            <div class="header-section">
                <div class="top-sub-title">THE WEDDING INVITATION</div>
                <h1 class="main-title">Save the Date</h1>
                <div class="wedding-of">for the marriage of</div>
            </div>

            <div class="couple-section">
                <div class="gold-divider">
                    <span class="gold-divider-icon">✦</span>
                </div>
                
                <div class="couples-name">B U N G A</div>
                <div class="ampersand">&</div>
                <div class="couples-name">D I M A S</div>

                <div class="gold-divider">
                    <span class="gold-divider-icon">✦</span>
                </div>
            </div>

            <div class="date-section">
                <div class="date-box">24</div>
                <div class="date-divider"></div>
                <div class="date-box">JUNI</div>
                <div class="date-divider"></div>
                <div class="date-box">2025</div>
            </div>

            <div class="details-section">
                <div class="venue-title">THE GRAND BALLROOM, HOTEL MAJAPAHIT</div>
                <div class="venue-address">Pukul 11.00 WIB - Selesai • Jl. Tunjungan, Genteng, Surabaya</div>
            </div>

        </div>

        <div class="wax-seal">
            <div class="wax-seal-inner">B & D</div>
        </div>

    </div>

</body>
</html>
